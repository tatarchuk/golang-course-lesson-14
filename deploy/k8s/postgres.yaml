# PostgreSQL 16 for albums. A StatefulSet gives the pod a fixed name (postgres-0) and its own volume
# (k3s local-path storage); the headless Service makes the DNS name "postgres" resolve to that pod
# once it is ready. The password comes from Secret albums-db (deploy/k8s/create-secrets.sh).
apiVersion: v1
kind: Service
metadata:
  name: postgres
  labels:
    app: postgres
spec:
  clusterIP: None
  selector:
    app: postgres
  ports:
    - name: postgres
      port: 5432
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports:
            - name: postgres
              containerPort: 5432
          env:
            - name: POSTGRES_USER
              value: albums
            - name: POSTGRES_DB
              value: albums
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: albums-db
                  key: POSTGRES_PASSWORD
            # A subdirectory of the volume, so initdb starts from an empty directory.
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "albums", "-d", "albums"]
            periodSeconds: 5
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: local-path
        resources:
          requests:
            storage: 1Gi
