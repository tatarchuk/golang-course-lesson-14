# Local stack: PostgreSQL 16 plus the API built from this repository.
# Database values default to the ones in .env.example; JWT_SECRET has no default on purpose,
# so copy .env.example to .env (or export JWT_SECRET) before `docker compose up`.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-albums}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-albums}
      POSTGRES_DB: ${POSTGRES_DB:-albums}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./scripts/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-albums} -d ${POSTGRES_DB:-albums}"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: .
    ports:
      - "${PORT:-8080}:8080"
    environment:
      # Inside the compose network the database host is the service name, not localhost.
      DATABASE_URL: postgres://${POSTGRES_USER:-albums}:${POSTGRES_PASSWORD:-albums}@postgres:5432/${POSTGRES_DB:-albums}?sslmode=disable
      MIGRATIONS_PATH: /app/migrations
      PORT: "8080"
      DB_LOG_LEVEL: ${DB_LOG_LEVEL:-info}
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env (cp .env.example .env)}
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
